# Mode per gate: deny | warn | off.
# warn logs what deny would have refused (session start prints the count) and lets the call through.
# Start on warn, read the log for a week, then move a gate to deny once its false positives are fixed.
number-gate=warn
claim-gate=warn
subagent-stop=warn
env-explicit=warn
# Refuses a whole read of a history file once it is longer than 400 lines. It names the way in, so deny costs nothing.
read-gate=deny
