# factory.conf: the client-specific values of a fork live here.
# Shell-style KEY=VALUE. Quote a value that holds spaces. Lines starting with # are comments.
# Every hook and script reads this file through scripts/_conf.py. Check it with: python3 scripts/check-conf.py
# Not here: gate modes (.claude/gates.conf), the mail deny list (.claude/settings.json), and a few fixed limits in
# the code (180-word mail limit in scripts/draft.py, 400-line read limit in read-gate.py, 7-day stamp age).

# --- who ---------------------------------------------------------------------
CLIENT_NAME="Acme Ltd"            # how the client is named in drafts and reports
CLIENT_SLUG=acme                  # short, lowercase, no spaces; used in ids and file names
OWNER_NAME="Owner"                # the human who keeps the yes (production, client mail)
# Optional: the address of the mailbox MAIL_CLI is logged in to. Without it each draft and each inbox sweep asks
# the mailbox for it with one extra call.
# OWNER_EMAIL=owner@yourcompany.example

# --- client repos ------------------------------------------------------------
# Sibling checkouts next to this repo, space-separated. They belong to the client:
# nothing from this repo (ledger, mistakes, state, drafts) is ever written into them.
CLIENT_REPOS="../acme-app ../acme-data"

# --- mail --------------------------------------------------------------------
# Addresses that count as "the client". Mail to anyone here goes through draft -> human send.
CLIENT_CONTACT_EMAILS="contact@acme.example"
# Command used to create drafts and read mail. Raw writes with it are blocked;
# only scripts/draft.py and scripts/send.py may write.
# The contract: the scripts run   <MAIL_CLI> gmail users drafts create --params '<json>' --json '<json>'
# (also: drafts delete | drafts send | messages list | messages get | getProfile) and parse JSON
# from stdout. `gws` does this as it is. Another mail tool needs a wrapper script that takes the same arguments;
# then also edit the `gws gmail ...` lines under permissions.deny in .claude/settings.json to name it.
# To pick a mailbox account through an environment variable, write   MAIL_CLI="env VAR=value gws"
# (a bare "VAR=value gws" is not a program and fails).
MAIL_CLI=gws

# --- production --------------------------------------------------------------
# Strings that mean "this command touches production" when seen in a command:
# a full cloud profile name, an account id, a full production hostname.
# A marker is matched as a plain substring of the whole command, so it must be distinctive. Do not list a short
# word or a branch name: `main` also matches `domain`, `maintain` and `src/main.py`, and every such command would
# be treated as a production write.
PROD_MARKERS="acme-prod 000000000000"
# Strings that mean development, same matching. A cloud command carrying neither kind is logged or refused,
# by the mode of env-explicit in .claude/gates.conf (shipped: warn).
DEV_MARKERS="acme-dev 111111111111"

# --- private words (optional) ------------------------------------------------
# Extra words client-repo-guard refuses in anything written into a client repo, space-separated, on top of this
# repo's own file names and ids. The default is the line below; setting the key replaces it.
# PRIVATE_WORDS="timesheet billable do-not-chase"

# --- consent -----------------------------------------------------------------
# The word that must be in a production write command AND in the owner's own recent prompt.
# The agent typing it is not consent.
PROD_CONSENT_TOKEN=PROD-WRITE-OK
# What the owner types to release a drafted mail. Pipe-separated, case-insensitive.
SEND_CONSENT_PHRASES="send it|ok send"
# Minutes a typed consent stays valid.
CONSENT_TTL_MIN=15

# --- limits ------------------------------------------------------------------
# Rounds of fix -> review before the loop stops and reports what keeps failing.
MAX_REVIEW_ROUNDS=3
# STATE.md holds "now" only. Above this many lines the state check fails.
STATE_MAX_LINES=150
